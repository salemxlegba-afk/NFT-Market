name: One-time deal view persistence fix

on:
  push:
    paths:
      - 'main.py'
      - '.github/workflows/fix-deal-persistence.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply persistence fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text()
          old_init = '    def __init__(self, match_id: str) -> None:\n        super().__init__(timeout=None)\n        self.match_id = match_id\n'
          new_init = '    def __init__(self, match_id: Optional[str] = None) -> None:\n        super().__init__(timeout=None)\n        self.match_id = match_id\n\n    async def _get_match_id(self, interaction: discord.Interaction) -> Optional[str]:\n        if self.match_id is not None:\n            return self.match_id\n        channel_id = getattr(interaction.channel, "id", None)\n        if channel_id is None:\n            return None\n        matches = await STORE.matches_for_user(interaction.user.id)\n        match = next((item for item in matches if item.channel_id == channel_id), None)\n        return match.match_id if match is not None else None\n'
          if old_init in s:
              s = s.replace(old_init, new_init, 1)
              s = s.replace('            await bot.change_deal_status(interaction, self.match_id, "COMPLETED")', '            match_id = await self._get_match_id(interaction)\n            if match_id is None:\n                await interaction.response.send_message("This deal could not be found.", ephemeral=True)\n                return\n            await bot.change_deal_status(interaction, match_id, "COMPLETED")', 1)
              s = s.replace('            await bot.change_deal_status(interaction, self.match_id, "CANCELLED")', '            match_id = await self._get_match_id(interaction)\n            if match_id is None:\n                await interaction.response.send_message("This deal could not be found.", ephemeral=True)\n                return\n            await bot.change_deal_status(interaction, match_id, "CANCELLED")', 1)
          elif 'def __init__(self, match_id: Optional[str] = None)' not in s:
              raise SystemExit('Expected DealActionView constructor not found')
          marker = '        bot.add_view(MainMenuView())\n'
          if 'bot.add_view(DealActionView())' not in s:
              if marker not in s:
                  raise SystemExit('Expected MainMenuView registration not found')
              s = s.replace(marker, marker + '        bot.add_view(DealActionView())\n', 1)
          p.write_text(s)
          PY
          python -m py_compile main.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
          else
            git add main.py
            git commit -m 'Fix persistent deal action buttons after restart'
            git push
          fi
