name: Apply cancel deal UI fix
on:
  push:
    paths:
      - '.github/workflows/apply-cancel-deal-ui-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = '''        channel = interaction.channel\n        if isinstance(channel, discord.TextChannel):\n            try:\n                await channel.send(f"🔒 Deal closed: **{status}**.")\n                await asyncio.sleep(2)\n                await channel.delete(reason=f"NFT Market deal {status.lower()}")\n            except (discord.NotFound, discord.Forbidden, discord.HTTPException):\n                pass\n'''
          new = '''        channel = interaction.channel\n        if isinstance(channel, discord.TextChannel):\n            try:\n                await channel.send(f"🔒 Deal closed: **{status}**.")\n                if status == "CANCELLED":\n                    guild = interaction.guild\n                    if guild is not None:\n                        menu_channel = next(\n                            (\n                                candidate\n                                for candidate in guild.text_channels\n                                if candidate.name.endswith("bot-commands")\n                            ),\n                            None,\n                        )\n                        if menu_channel is not None:\n                            buyer_count, seller_count = await STORE.active_counts(guild.id)\n                            embed = discord.Embed(\n                                title="🖼️ NFT Market",\n                                description=(\n                                    "❌ **Deal cancelled successfully.**\\n\\n"\n                                    "You can continue using the NFT Market below.\\n\\n"\n                                    f"🟢 **Active Buyers: {buyer_count}**\\n"\n                                    f"🔴 **Active Sellers: {seller_count}**\\n\\n"\n                                    "The counters represent users who currently have an active request."\n                                ),\n                                color=discord.Color.blurple(),\n                            )\n                            await menu_channel.send(embed=embed, view=MainMenuView())\n                await asyncio.sleep(2)\n                await channel.delete(reason=f"NFT Market deal {status.lower()}")\n            except (discord.NotFound, discord.Forbidden, discord.HTTPException):\n                pass\n'''
          if old not in s:
              raise SystemExit('Target block not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile main.py
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git rm .github/workflows/apply-cancel-deal-ui-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Improve cancel deal return to NFT Market menu'
          git push
